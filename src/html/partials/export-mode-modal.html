    <div class="texture-export-mode-modal" id="textureExportModeModal" style="display: none;">
        <div class="texture-export-mode-backdrop" id="textureExportModeBackdrop"></div>
        <div class="texture-export-mode-dialog" id="textureExportModeDialog" role="dialog" aria-modal="true" aria-labelledby="textureExportModeTitle">
            <div class="texture-export-mode-heading">
                <div class="texture-export-mode-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </div>
                <div>
                    <h3 id="textureExportModeTitle">选择导出方式</h3>
                    <p id="textureExportModeDesc">选择保留工程数据，或生成仅用于分享的发布版。</p>
                </div>
            </div>
            <div class="texture-export-mode-options">
                <button type="button" class="texture-export-mode-option" id="textureExportEditableBtn">
                    <span class="texture-export-mode-option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                        </svg>
                    </span>
                    <span class="texture-export-mode-option-text">
                        <span class="texture-export-mode-option-title">可继续编辑（推荐）</span>
                        <span class="texture-export-mode-option-desc">保留原图、生成参数与投皮设置，文件可能更大。</span>
                    </span>
                </button>
                <button type="button" class="texture-export-mode-option" id="textureExportReleaseBtn">
                    <span class="texture-export-mode-option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                    </span>
                    <span class="texture-export-mode-option-text">
                        <span class="texture-export-mode-option-title">仅发布</span>
                        <span class="texture-export-mode-option-desc">只保留 osu!stable 使用的成品，文件更小。</span>
                    </span>
                </button>
            </div>
            <div class="texture-export-mode-actions">
                <button type="button" class="texture-export-mode-cancel" id="textureExportModeCancelBtn">取消</button>
            </div>
        </div>
    </div>
