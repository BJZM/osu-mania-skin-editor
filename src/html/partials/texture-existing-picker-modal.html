<!-- 从当前皮肤已有贴图中选择路径并引用 -->
<div class="texture-existing-modal" id="textureExistingPickerModal" style="display: none;">
    <div class="texture-existing-backdrop" id="textureExistingPickerBackdrop"></div>
    <div class="texture-existing-dialog" role="dialog" aria-modal="true" aria-labelledby="textureExistingPickerTitle">
        <div class="texture-existing-header">
            <div class="texture-existing-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span id="textureExistingPickerTitle">从已有贴图导入</span>
            </div>
            <button type="button" class="texture-existing-close" id="textureExistingPickerCloseBtn" title="关闭 (Esc)">&times;</button>
        </div>

        <div class="texture-existing-body">
            <div class="texture-existing-target">
                <div>
                    <span class="texture-existing-target-label">目标贴图</span>
                    <strong id="textureExistingPickerTargetLabel">-</strong>
                </div>
                <div class="texture-existing-current">
                    <span>当前路径</span>
                    <code id="textureExistingPickerCurrentPath">未指定</code>
                </div>
            </div>

            <div class="texture-existing-toolbar">
                <label class="texture-existing-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.5-3.5"></path>
                    </svg>
                    <input type="search" id="textureExistingPickerSearch" placeholder="搜索贴图名或路径" autocomplete="off">
                </label>
                <span class="texture-existing-count" id="textureExistingPickerCount">0 项</span>
            </div>

            <div class="texture-existing-grid" id="textureExistingPickerGrid" role="listbox" aria-label="当前皮肤已有贴图"></div>
            <div class="texture-existing-empty" id="textureExistingPickerEmpty" style="display: none;">
                当前皮肤中没有可引用的贴图
            </div>
        </div>

        <div class="texture-existing-footer">
            <span class="texture-existing-hint">选择后只修改 skin.ini 路径，不复制或覆盖图片</span>
            <div class="texture-existing-actions">
                <button type="button" class="btn btn-secondary" id="textureExistingPickerCancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="textureExistingPickerConfirmBtn" disabled>使用此贴图</button>
            </div>
        </div>
    </div>
</div>
