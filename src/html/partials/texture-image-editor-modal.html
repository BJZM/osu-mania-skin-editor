            <!-- 简单贴图编辑器：裁剪与透明扩边 -->
            <div class="texture-image-modal" id="textureImageEditorModal" style="display: none;">

                                    <canvas id="textureImagePreviewCanvas" width="360" height="280"></canvas>
                                </div>

                                        <span id="textureImageSourceSize">-</span>
                                        <span id="textureImageWorkingSize">-</span>

                                    </div>

                                        </div>
                                    </div>
                                    <div class="texture-image-number-grid">

                                            <span>左边界</span>

                                        <label>
                                            <span>上边界</span>
                                            <input type="number" id="textureImageCropY" min="-8192" step="1" value="0">

                                    </div>
                                </section>

                                            <div class="texture-image-control-title">拉伸与缩放</div>
                                        </div>
                                    </div>

                                        <label>

                                        </label>
                                        <label>
                                            <span>纵向拉伸 (px)</span>
                                            <input type="number" id="textureImageStretchY" step="1" value="0">
                                        </label>
                                    </div>
                                </section>

                                <section class="texture-image-control-section" id="textureImageLongBodySection" style="display: none;">
                                    <div class="texture-image-control-head">
                                        <div>
                                            <div class="texture-image-control-title">一键投皮</div>

                                </section>

                            <button type="button" class="btn btn-primary" id="textureImageUnsavedSaveBtn">保存</button>
                        </div>
                    </div>
                </div>

                        </div>
