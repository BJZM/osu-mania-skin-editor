        <!-- 现代化全功能底栏播放器与控制台 (Docked Studio Player Bar) -->
        <div class="player-controls studio-bottom-bar disabled" id="playerControls">
            <!-- 顶行：时间轴进度与时间显示 -->
            <div class="progress-section">
                <span id="currentTimeText" class="time-label">00:00</span>
                <div class="slider-wrapper">
                    <input type="range" id="progressRange" class="progress-slider" min="0" max="100" value="0" step="0.05" disabled>
                </div>
                <span id="remainTimeText" class="time-label">-00:00</span>
            </div>

            <!-- 底行：播放控制、游戏选项与谱面实时统计 -->
            <div class="controls-action-row">
                <!-- 左区：播放/暂停与音量 -->
                <div class="deck-group deck-playback">
                    <button class="play-pause-btn" id="playPauseBtn" title="播放 / 暂停 (空格键)" disabled>
                        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>

                    <div class="volume-mixer" role="group" aria-label="音量控制">
                        <div class="volume-control">
                            <button type="button" class="volume-mute-btn" id="volumeMuteBtn" title="歌曲静音切换" aria-label="歌曲静音切换" aria-pressed="false">
                                <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path class="vol-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    <path class="vol-wave-loud" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                                </svg>
                                <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <line x1="23" y1="9" x2="17" y2="15"></line>
                                    <line x1="17" y1="9" x2="23" y2="15"></line>
                                </svg>
                            </button>
                            <span class="volume-label">歌曲</span>
                            <input type="range" id="volumeRange" class="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="歌曲音量">
                            <span id="volumeText" class="volume-percent">80%</span>
                        </div>
                        <div class="volume-control">
                            <button type="button" class="volume-mute-btn" id="effectsVolumeMuteBtn" title="音效静音切换" aria-label="音效静音切换" aria-pressed="false">
                                <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path class="vol-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    <path class="vol-wave-loud" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                                </svg>
                                <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <line x1="23" y1="9" x2="17" y2="15"></line>
                                    <line x1="17" y1="9" x2="23" y2="15"></line>
                                </svg>
                            </button>
                            <span class="volume-label">音效</span>
                            <input type="range" id="effectsVolumeRange" class="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="音效音量">
                            <span id="effectsVolumeText" class="volume-percent">80%</span>
                        </div>
                    </div>
                </div>

                <div class="deck-divider"></div>

                <!-- 中区：故事板/视频开关、流速调节与背景暗化 -->
                <div class="deck-group deck-tweaks">
                    <div class="tweak-switch-item studio-utility-toggle" title="开启 / 关闭编辑器内的连击提示图预览；游戏内总开关需要在 osu!stable 中开启或关闭">
                        <span class="tweak-label">连击提示图</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="comboburstPreviewToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="tweak-switch-item studio-utility-toggle" title="开启判定提示动态演示：按真实比率展示 300MAX/300/200/100/50 及 Miss 断连恢复">
                        <span class="tweak-label">判定演示</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="previewJudgementToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="tweak-switch-item" title="开启 / 关闭故事板渲染 (对齐 osu!stable 故事板开关)">
                        <span class="tweak-label">故事板</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="storyboardToggle" checked disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="tweak-switch-item" title="开启 / 关闭视频背景播放 (对齐 osu!stable 视频背景开关)">
                        <span class="tweak-label">视频</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="videoToggle" checked disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="tweak-slider-item" title="流速调节 (Scroll Speed 1-40)">
                        <span class="tweak-label">流速 </span>
                        <input type="range" id="speedRange" min="1" max="40" step="1" value="24">
                        <span id="speedText" class="tweak-val stats-value osu-stat-pill">24</span>
                    </div>
                    <div class="tweak-slider-item" title="背景暗化 (Background Dim)">
                        <span class="tweak-label">暗化 </span>
                        <input type="range" id="dimRange" min="0" max="100" step="1" value="80">
                        <span id="dimText" class="tweak-val stats-value osu-stat-pill">80%</span>
                    </div>
                </div>

                
            </div>
        </div>
