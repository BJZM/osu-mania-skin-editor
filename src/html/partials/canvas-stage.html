        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas" width="1280" height="720"></canvas>

            <!-- 全屏悬浮按钮 -->
            <button class="fullscreen-btn" id="fullscreenBtn" title="全屏 (F)">
                <!-- 进入全屏图标 -->
                <svg class="enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <!-- 退出全屏图标 -->
                <svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                </svg>
            </button>

            <!-- 启动面板：谱面、皮肤来源与拖拽入口 -->
            <div class="startup-actions" id="startupActions" aria-label="选择开始方式">
                <div class="startup-actions-content">
                    <button type="button" class="startup-action startup-action-beatmap" id="startupImportBeatmapBtn">
                        <span class="startup-action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                        </span>
                        <span class="startup-action-copy">
                            <span class="startup-action-title">导入谱面</span>
                            <span class="startup-action-desc" id="startupBeatmapDesc">点击或拖拽 .osz / .zip / .osu 文件</span>
                        </span>
                    </button>

                    <div class="startup-action-separator" aria-hidden="true">
                        <span></span>
                    </div>

                    <button type="button" class="startup-action startup-action-skin" id="startupImportSkinBtn">
                        <span class="startup-action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </span>
                        <span class="startup-action-copy">
                            <span class="startup-action-title">导入皮肤</span>
                            <span class="startup-action-desc" id="startupSkinDesc">点击或拖拽 .osk / .zip 皮肤包</span>
                        </span>
                    </button>

                    <button type="button" class="startup-action startup-action-default" id="startupUseDefaultSkinBtn">
                        <span class="startup-action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                        </span>
                        <span class="startup-action-copy">
                            <span class="startup-action-title">从默认皮肤开始</span>
                            <span class="startup-action-desc" id="startupDefaultDesc">使用 osu!stable 官方默认皮肤作为工作区</span>
                        </span>
                    </button>
                </div>
            </div>

            <!-- 中央进度加载面板 -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-card">
                    <div class="loading-header">
                        <span class="loading-title" id="loadingTitle">正在加载资源...</span>
                        <span class="loading-percent" id="loadingPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                    <div class="loading-file-text" id="loadingFileText">准备就绪</div>
                </div>
            </div>
            <!-- 画布元素选中框紧贴吸附操作工具栏 -->
            <div class="canvas-selected-card" id="canvasSelectedCard" style="display: none;">
                <div class="card-row-first">
                    <div class="card-title-group">
                    <span class="card-title" id="cardTitle">判定线</span>
                </div>

                <!-- 快捷步进调节器 (针对单独轨道宽度与间距调节) -->
                <div class="card-quick-stepper" id="cardQuickStepper" style="display: none;">
                    <div class="stepper-item" id="cardWidthStepper">
                        <span class="stepper-label">宽</span>
                        <button type="button" class="stepper-btn" id="cardWidthDecBtn" title="减少列宽 (-1, Shift -5)">-</button>
                        <span class="stepper-val" id="cardWidthVal">30</span>
                        <button type="button" class="stepper-btn" id="cardWidthIncBtn" title="增加列宽 (+1, Shift +5)">+</button>
                    </div>
                    <div class="stepper-item" id="cardSpacingStepper" style="display: none;">
                        <span class="stepper-label" id="cardSpacingLabel">距</span>
                        <button type="button" class="stepper-btn" id="cardSpacingDecBtn" title="减少间距 (-1, Shift -5, 最小0)">-</button>
                        <span class="stepper-val" id="cardSpacingVal">0</span>
                        <button type="button" class="stepper-btn" id="cardSpacingIncBtn" title="增加间距 (+1, Shift +5)">+</button>
                    </div>
                    <div class="stepper-item" id="cardPosStepper" style="display: none;">
                        <button type="button" class="stepper-btn" id="cardPosDecBtn" title="减小数值 (-1, Shift -5)">-</button>
                        <span class="stepper-val" id="cardPosVal" title="点击可直接输入数值">0</span>
                        <button type="button" class="stepper-btn" id="cardPosIncBtn" title="增加数值 (+1, Shift +5)">+</button>
                    </div>
                </div>
                <div class="card-divider"></div>
                <div class="card-actions">
                    <button type="button" class="card-btn" id="cardApplyAllTracksBtn" title="将当前选中的轨道宽度与间距应用到全部轨道" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <line x1="8" y1="4" x2="8" y2="20"></line>
                            <line x1="16" y1="4" x2="16" y2="20"></line>
                        </svg>
                        <span>应用给所有轨道</span>
                    </button>
                    <button type="button" class="card-btn" id="cardLocateParamBtn" title="在详细设置中定位此参数">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>定位参数</span>
                    </button>
                    <button type="button" class="card-btn" id="cardLocateComboTextureBtn" title="定位到连击数字使用的贴图" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>替换贴图</span>
                    </button>
                    <button type="button" class="card-btn" id="cardPreviewJudgementBtn" title="开启/关闭判定提示动态演示 (包含各等级判定与Miss断连恢复)" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>演示判定</span>
                    </button>
                    <button type="button" class="card-btn" id="cardReplaceScorebarBgBtn" title="替换血条背景贴图 (scorebar-bg.png)" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>替换血条背景</span>
                    </button>
                    <button type="button" class="card-btn" id="cardReplaceScorebarColourBtn" title="替换血条本体填充贴图 (scorebar-colour.png)" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>替换血条本体</span>
                    </button>
                    <button type="button" class="card-btn" id="cardReplaceTextureBtn" title="替换本地贴图图片" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>替换贴图</span>
                    </button>
                    <button type="button" class="card-close-btn" id="cardCloseBtn" title="取消选中 (Esc)">✕</button>
                </div>
                </div>

                <!-- 第二行：底色与透明度调节 (针对单轨，与第一行宽距对应) -->
                <div class="card-row-second" id="cardTrackColourRow" style="display: none;">
                    <div class="card-colour-group">
                        <span class="stepper-label">底色</span>
                        <input type="color" class="card-colour-picker" id="cardColPicker" title="选择当前轨道底色" value="#000000">
                    </div>
                    <div class="card-colour-group">
                        <span class="stepper-label">透明度</span>
                        <input type="range" class="card-colour-slider" id="cardColOpacitySlider" min="0" max="255" step="1" value="255" title="滑动调节透明度 (0 - 255)">
                        <span class="card-colour-val" id="cardColOpacityVal">255</span>
                    </div>
                    <button type="button" class="card-btn" id="cardApplyAllColourBtn" title="将当前选中的底色与透明度应用到所有轨道">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                        <span>全轨同色</span>
                    </button>
                </div>

                <!-- 连击专用第 2 行：Hold 变色实时编辑与预览 -->
                <div class="card-combo-edit-row" id="cardComboHoldRow" style="display: none;">
                    <span class="card-edit-label">Hold 变色</span>
                    <div class="card-colour-group">
                        <input type="color" class="card-colour-picker" id="cardComboHoldPicker" title="选择按住长条时连击数字的变色滤镜" value="#ffbf33">
                        <input type="range" class="card-colour-slider" id="cardComboHoldAlpha" min="0" max="255" step="1" value="255" title="调整 Hold 变色的透明度">
                        <span class="card-colour-val" id="cardComboHoldAlphaVal">255</span>
                    </div>
                    <button type="button" class="card-btn" id="cardComboHoldPreviewBtn" title="在画布上预览 Hold 连击数字变色">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>预览变色</span>
                    </button>
                </div>

                <!-- 连击专用第 3 行：断连遮罩颜色与预览 -->
                <div class="card-combo-edit-row" id="cardComboBreakRow" style="display: none;">
                    <span class="card-edit-label">断连遮罩</span>
                    <div class="card-colour-group">
                        <input type="color" class="card-colour-picker" id="cardComboBreakPicker" title="选择断连红闪与连击爆破的警示颜色" value="#ff0000">
                    </div>
                    <button type="button" class="card-btn" id="cardComboBreakPreviewBtn" title="在画布上预览当前断连遮罩颜色">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>预览断连</span>
                    </button>
                </div>
            </div>

            <!-- 拖拽时的数值悬浮提示 -->
            <div class="canvas-drag-tooltip" id="canvasDragTooltip" style="display: none;"></div>

            <!-- 本地图片替换上传隐藏表单 -->
            <input type="file" id="textureReplaceInput" accept="image/*" style="display: none;">


            <!-- @include texture-upload-modal.html -->
            <!-- @include texture-existing-picker-modal.html -->
            <!-- @include animation-editor-modal.html -->
            <!-- @include texture-image-editor-modal.html -->
        </div>
